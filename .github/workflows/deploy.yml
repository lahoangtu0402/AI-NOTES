name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # cần đủ lịch sử Git để tính "ngày cập nhật" từng bài

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Dùng `npm install` thay cho `npm ci`: file package-lock.json tạo trên máy khác hệ điều hành
      # (macOS/Windows) có thể thiếu vài gói tùy chọn mà Linux cần, khiến `npm ci` báo lỗi.
      - run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Với repo "ten-ban/ai-notes", trang nằm ở https://ten-ban.github.io/ai-notes/
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4